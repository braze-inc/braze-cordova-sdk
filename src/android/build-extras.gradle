repositories {
    google()
    mavenCentral()
}

dependencies {
    def braze_sdk_version = "43.1.1"
    implementation "com.braze:android-sdk-ui:${braze_sdk_version}"
    implementation "com.braze:android-sdk-location:${braze_sdk_version}"
    implementation 'com.google.firebase:firebase-messaging:23.0.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.4'
    }
}

// Do not set kotlinOptions.jvmTarget. cordova-android 14+ defaults Java/Kotlin
// to 11; a hardcoded 1.8 causes an inconsistent JVM target with Java.
ext.postBuildExtras = {
    def googleServicesJson = [
        file("${project.projectDir}/google-services.json"),
        file("${rootProject.projectDir}/google-services.json")
    ].find { it.exists() }
    if (googleServicesJson != null) {
        // Apply by class name since this file is not the root Gradle script.
        apply plugin: com.google.gms.googleservices.GoogleServicesPlugin
    }

    android {
        kotlinOptions {
            freeCompilerArgs = ['-Xjvm-default=all']
        }
    }
}
